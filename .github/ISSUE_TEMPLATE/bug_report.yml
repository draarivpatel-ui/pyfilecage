name: Bug report
description: Report incorrect validation, detection, parsing, or packaging behavior
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Python code, policy, and a hex-encoded or otherwise safe minimal byte fixture.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: pyfilecage version, Python version, and operating system.
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: Finding codes returned, if any.
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not describe an exploitable validation bypass. I know exploitable bypasses belong in a private security advisory.
          required: true
