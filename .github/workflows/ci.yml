name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install . build
      - name: Run unittest suite
        run: python -m unittest discover -s tests
      - name: CLI smoke test
        run: |
          python - <<'PY'
          import struct
          import tempfile
          from pathlib import Path
          png = (
              b"\x89PNG\r\n\x1a\n"
              + struct.pack(">I", 13) + b"IHDR"
              + struct.pack(">II", 1, 1) + b"\x08\x02\x00\x00\x00"
              + b"\x00\x00\x00\x00"
              + struct.pack(">I", 0) + b"IDAT\x00\x00\x00\x00"
              + struct.pack(">I", 0) + b"IEND\x00\x00\x00\x00"
          )
          path = Path(tempfile.gettempdir()) / "pyfilecage-ci-smoke.png"
          path.write_bytes(png)
          print(path)
          PY
          pyfilecage inspect /tmp/pyfilecage-ci-smoke.png --preset images-safe --json
          python -m pyfilecage --version
      - name: Build wheel and sdist
        run: python -m build
      - name: Inspect artifacts
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
          assert "pyfilecage/py.typed" in names
          assert not any(name.startswith("tests/") or "/tests/" in name for name in names)
          assert not any("__pycache__" in name or name.endswith((".pyc", ".pyo")) for name in names)
          print("artifact contents verified")
          PY
