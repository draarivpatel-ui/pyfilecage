[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfilecage"
version = "1.0.0"
description = "Zero-dependency CWE-434 file-upload security validation with magic-byte verification, polyglot detection, active-content scanning, pixel-bomb guards, and filename sanitization"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "draarivpatel-ui contributors" }]
keywords = [
    "cwe-434",
    "file-upload",
    "filename-sanitization",
    "magic-bytes",
    "mime-sniffing",
    "pdf-security",
    "pixel-bomb",
    "polyglot",
    "rtlo",
    "security",
    "svg-xss",
    "xxe",
    "zero-dependency",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
pyfilecage = "pyfilecage.cli:main"

[project.urls]
Homepage = "https://github.com/draarivpatel-ui/pyfilecage"
Repository = "https://github.com/draarivpatel-ui/pyfilecage"
Issues = "https://github.com/draarivpatel-ui/pyfilecage/issues"
Documentation = "https://github.com/draarivpatel-ui/pyfilecage#readme"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyfilecage*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pyfilecage = ["py.typed"]
